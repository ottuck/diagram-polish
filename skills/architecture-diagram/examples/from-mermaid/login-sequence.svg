<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Login flow — Architecture</title>
  <desc id="desc">The web app sends the user to Auth0 to sign in, and the API server verifies the login with Auth0. The API stores users and reports in Postgres and queues a weekly summary email through the email service.</desc>
  <defs><marker id="solid" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#7f93ae" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="solid-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#7f93ae" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="dashed" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8b90c6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="dashed-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#8b90c6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1000" height="460" rx="20" fill="#fbfcfe"/>
  <g font-family="Geist, &quot;Noto Sans KR&quot;, &quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Noto Sans JP&quot;, &quot;Yu Gothic&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, Helvetica, sans-serif"><path d="M190 100 L420 100" fill="none" stroke="#7f93ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)"/><path d="M540 100 L818 100 Q830 100 830 112 L830 216" fill="none" stroke="#7f93ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)" marker-start="url(#solid-start)"/><path d="M480 134 L480 216" fill="none" stroke="#7f93ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)" marker-start="url(#solid-start)"/><path d="M544 250 L770 250" fill="none" stroke="#7f93ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)" marker-start="url(#solid-start)"/><path d="M480 284 L480 374" fill="none" stroke="#7f93ae" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)" marker-start="url(#solid-start)"/><path d="M416 250 L205.5 250" fill="none" stroke="#8b90c6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#dashed)"/><path d="M130 224 L130 126" fill="none" stroke="#8b90c6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#dashed)"/><g text-anchor="middle"><rect x="70" y="74" width="120" height="52" rx="16" fill="#eceefb" stroke="#c9cff0"/><text x="130" y="105" font-size="15" font-weight="600" fill="#3a3f86">You</text><rect x="420" y="66" width="120" height="68" rx="16" fill="#e8f0fb" stroke="#bfd2ee"/><text x="480" y="95" font-size="15" font-weight="600" fill="#1d3a63">Web app</text><text x="480" y="116" font-size="12" fill="#4f6e96">React</text><rect x="770" y="216" width="120" height="68" rx="16" fill="#eef1f5" stroke="#d3dae4"/><text x="830" y="245" font-size="15" font-weight="600" fill="#1c2430">Auth0</text><text x="830" y="266" font-size="12" fill="#5d6a7b">Sign-in</text><rect x="416" y="216" width="128" height="68" rx="16" fill="#e8f0fb" stroke="#bfd2ee"/><text x="480" y="245" font-size="15" font-weight="600" fill="#1d3a63">API server</text><text x="480" y="266" font-size="12" fill="#4f6e96">FastAPI</text><rect x="54.5" y="224" width="151" height="52" rx="16" fill="#eef1f5" stroke="#d3dae4"/><text x="130" y="255" font-size="15" font-weight="600" fill="#1c2430">Email service</text><rect x="420" y="374" width="120" height="52" rx="16" fill="#e8f0fb" stroke="#bfd2ee"/><text x="480" y="405" font-size="15" font-weight="600" fill="#1d3a63">Postgres</text><rect x="268" y="89" width="74" height="22" rx="11" fill="#f2f6fc" stroke="#d3e0f0"/><text x="305" y="104" font-size="12" fill="#3d5573">Open app</text><rect x="656.5" y="89" width="57" height="22" rx="11" fill="#f2f6fc" stroke="#d3e0f0"/><text x="685" y="104" font-size="12" fill="#3d5573">Login</text><rect x="453.5" y="164" width="53" height="22" rx="11" fill="#f2f6fc" stroke="#d3e0f0"/><text x="480" y="179" font-size="12" fill="#3d5573">REST</text><rect x="625.5" y="239" width="63" height="22" rx="11" fill="#f2f6fc" stroke="#d3e0f0"/><text x="657" y="254" font-size="12" fill="#3d5573">Verify</text><rect x="423" y="318" width="114" height="22" rx="11" fill="#f2f6fc" stroke="#d3e0f0"/><text x="480" y="333" font-size="12" fill="#3d5573">Users · reports</text><rect x="264.3" y="239" width="93" height="22" rx="11" fill="#f5f5fd" stroke="#dadcf2"/><text x="310.8" y="254" font-size="12" fill="#545a96">Queue email</text><rect x="73.5" y="164" width="113" height="22" rx="11" fill="#f5f5fd" stroke="#dadcf2"/><text x="130" y="179" font-size="12" fill="#545a96">Weekly summary</text></g></g>
</svg>
