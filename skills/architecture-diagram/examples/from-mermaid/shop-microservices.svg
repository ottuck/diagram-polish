<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
  <title id="title">Shop microservices — Architecture</title>
  <desc id="desc">Web and mobile clients call a Kong gateway, which routes to the auth, catalog and order services. Catalog and orders use Postgres and Redis; new orders go to Kafka, which feeds the payment service (Stripe) and the notification service (SendGrid).</desc>
