<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
  <title id="title">Pokepedia — Architecture</title>
  <desc id="desc">The browser loads pages from a Next.js app on Vercel and talks to Supabase directly for sign-in and reads, while Server Actions write game state through RPC. A sync script run by hand copies Pokémon data from PokeAPI into Postgres and Storage. The Unity battle runs in an iframe from its own host.</desc>
