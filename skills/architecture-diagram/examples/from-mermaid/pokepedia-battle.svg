<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
  <title id="title">Pokepedia Battle — Architecture</title>
  <desc id="desc">Pokepedia's quiz feeds a sticker collection kept in Supabase, and the battle page embeds the Unity game in an iframe. The two sides exchange messages with postMessage; the game reads artwork from Supabase by public URL.</desc>
