<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" role="img" aria-labelledby="title desc">
  <title id="title">Pokepedia — Architecture</title>
  <desc id="desc">The web app and the battle are separate projects. The page opens the Unity build in an iframe and passes the Pikachu over postMessage. Pokémon data was copied from PokeAPI once, so nothing outside is called at runtime.</desc>
  <defs><marker id="solid" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8c9c90" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="solid-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#8c9c90" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="dashed" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#b49b72" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="dashed-start" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="7" markerHeight="7" orient="auto" overflow="visible"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#b49b72" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="940" height="440" rx="20" fill="#fdfdfb"/>
  <g font-family="Geist, &quot;Noto Sans KR&quot;, &quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Noto Sans JP&quot;, &quot;Yu Gothic&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, Helvetica, sans-serif"><rect x="180" y="186" width="360" height="118" rx="18" fill="#faf7f1" stroke="#ebe3d6" stroke-dasharray="5 5"/><text x="194" y="206" font-size="12" fill="#71675e">pokepedia-unity · separate repo</text><path d="M160 80 L290.5 80" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)"/><path d="M509.5 80 L706.5 80" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)"/><path d="M400 114 L400 222" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)" marker-start="url(#solid-start)"/><path d="M560 360 L560 268 Q560 256 572 256 L730.5 256" fill="none" stroke="#b49b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#dashed)"/><path d="M800 222 L800 114" fill="none" stroke="#b49b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#dashed)"/><path d="M800 290 L800 352" fill="none" stroke="#b49b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#dashed)"/><g text-anchor="middle"><rect x="40" y="54" width="120" height="52" rx="16" fill="#fbf4e6" stroke="#ddcfb4"/><text x="100" y="85" font-size="15" font-weight="600" fill="#6f5a39">Player</text><rect x="290.5" y="46" width="219" height="68" rx="16" fill="#edf5ee" stroke="#c8d8cb"/><text x="400" y="75" font-size="15" font-weight="600" fill="#344c3b">Next.js · Vercel</text><text x="400" y="96" font-size="12" fill="#5e6f5c">Tokyo · pages, Server Actions</text><rect x="706.5"