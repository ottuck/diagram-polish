<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Puny Chat — Architecture</title>
  <desc id="desc">Sign-in goes through Firebase, and the server checks each ID token. Chat runs over REST and WebSocket to one Spring server in Sydney, which sends a push when a message goes unread.</desc>
