  <rect width="1000" height="400" rx="20" fill="#fdfdfb"/>
  <g font-family="Geist, &quot;Noto Sans KR&quot;, &quot;Malgun Gothic&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Noto Sans JP&quot;, &quot;Yu Gothic&quot;, &quot;Hiragino Sans&quot;, &quot;Noto Sans SC&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, Helvetica, sans-serif"><rect x="320" y="30" width="280" height="240" rx="18" fill="#faf7f1" stroke="#ebe3d6" stroke-dasharray="5 5"/><text x="334" y="50" font-size="12" fill="#71675e">Bun · one process</text><path d="M170 90 L371.5 90" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)"/><path d="M197.5 240 L238 240 Q250 240 250 228 L250 114 Q250 102 262 102 L371.5 102" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)"/><path d="M460 124 L460 186" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)"/><path d="M583.5 220 L793.5 220" fill="none" stroke="#8c9c90" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solid)" marker-start="url(#solid-start)"/><path d="M460 254 L460 338 Q460 350 472 350 L775 350" fill="none" stroke="#b49b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#dashed)"/><g text-anchor="middle"><rect x="50" y="56" width="120" height="68" rx="16" fill="#edf5ee" stroke="#c8d8cb"/><text x="110" y="85" font-size="15" font-weight="600" fill="#344c3b">Web app</text><text x="110" y="106" font-size="12" fill="#5e6f5c">React</text><rect x="22.5" y="206" width="175" height="68" rx="16" fill="#f3ece1" stroke="#e0d6c6"/><text x="110" y="235" font-size="15" font-weight="600" fill="#231d18">Claude / ChatGPT</text><text x="110" y="256" font-size="12" fill="#6b6158">MCP · OAuth</text><rect x="371.5" y="56" width="177" height="68" rx="16" fill="#edf5ee" stroke="#c8d8cb"/><text x="460" y="85" font-size="15"