<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">UR Check — Architecture</title>
  <desc id="desc">One Bun process serves the web app, the MCP server that Claude and ChatGPT connect to, and the scheduler that checks UR's listings.</desc>
