<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
  <title id="title">Trading Lab — Architecture</title>
  <desc id="desc">The screens and the worker only talk through the database. Only the worker reaches the brokerage, Claude and Telegram, and the demo runs on its own data with no keys.</desc>
