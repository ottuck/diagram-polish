<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title desc">
  <title id="title">My App — Architecture</title>
  <desc id="desc">Clients talk to one API server, which keeps data in Postgres and sends mail through a provider.</desc>
