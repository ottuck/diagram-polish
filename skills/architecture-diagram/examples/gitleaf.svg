<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="406" viewBox="0 0 1080 406" role="img" aria-labelledby="title desc">
  <title id="title">GitLeaf — Architecture</title>
  <desc id="desc">Solid arrows are image requests and storage access; dashed arrows are the daily refresh. The first request for a garden also fetches its GitHub activity and draws it.</desc>
